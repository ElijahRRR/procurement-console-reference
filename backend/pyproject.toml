[project]
name = "procurement-console"
version = "0.1.0"
description = "采购控制台：飞书 / 文件订单接入、买家账号分配、插件执行协议"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "psycopg[binary]==3.2.9",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
